<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Shed</title>
  <style>
    body {
    margin: 0;
    background-image: url("background.PNG");
    background-size:cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
      }
    
    header {
      top: 0;
      width: 100%;
      height: 90px;
      left: 0;
      z-index: 10;
      background: rgba(20, 15, 10, 0.75);
      display: flex;
      position: fixed;
      align-items: center;
      padding-left: 40px;
      border-bottom: 2px solid #A2917B;
    }

    header a {
      color: #A2917B;
      text-decoration: none;
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    aside {
      top: 90px;
      width: 250px;
      background: rgba(20, 15, 10, 0.75);
      height: calc(100vh - 90px);
      padding: 20px;
      position: fixed;
      right: 0;
      border-top: 2px solid #A2917B;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">
      The Shed
    </a>
  </header>

  <aside>
    Sidebar
  </aside>

  <main>
    <h2>Workbench</h2>
    <p>Welcome to The Shed.</p>
  </main>

  <footer>
    <p>Built by Nicholas Ridgway</p>
  </footer>

</body>
</html>
